name: assurance-gate
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Run assurance + gate the PR on the signed evidence object
        run: |
          PYTHONPATH=src python -m aah.cli.main run --out out
          # The CI is the producer, so it pins its own signing key as the trust anchor
          # -> full VERIFIED (exit 0). Without an anchor, verify is TAMPER-EVIDENT ONLY
          # (exit 3) by design, since a self-asserted key proves no authorship.
          KEY=$(python -c "import json;print(json.load(open('out/evidence.json'))['seal']['public_key_hex'])")
          PYTHONPATH=src python -m aah.cli.main verify out/evidence.json --trusted-key "$KEY"
          PYTHONPATH=src python -m aah.cli.main gate   out/evidence.json   # non-zero fails the PR
