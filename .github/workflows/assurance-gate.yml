name: assurance-gate
on: [pull_request]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Run assurance + gate the PR on the signed evidence object
        run: |
          set -e
          PYTHONPATH=src python -m aah.cli.main run --out out
          # Integrity + decision replay hold from the artifact alone. Without a trust
          # anchor that is TAMPER-EVIDENT ONLY (exit 3) by design — a self-asserted key
          # proves no authorship. Assert that honest verdict. NB: `|| rc=$?` so `set -e`
          # doesn't abort on the intended non-zero exit before we can check it.
          rc=0; PYTHONPATH=src python -m aah.cli.main verify out/evidence.json || rc=$?; test "$rc" -eq 3
          # The demo runner signs with the PUBLISHED seed=1 key, so pinning it proves
          # reproducibility, not authorship: verify flags it distinctly (exit 4). A real
          # producer would pin a private key here and get a full VERIFIED (exit 0).
          KEY=$(python -c "import json;print(json.load(open('out/evidence.json'))['seal']['public_key_hex'])")
          rc=0; PYTHONPATH=src python -m aah.cli.main verify out/evidence.json --trusted-key "$KEY" || rc=$?; test "$rc" -eq 4
          PYTHONPATH=src python -m aah.cli.main gate   out/evidence.json   # non-zero fails the PR
