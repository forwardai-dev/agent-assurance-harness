[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-assurance-harness"
version = "0.1.0"
description = "Offline-verifiable Agent Assurance Evidence standard + deterministic policy gate (eval + security + governance) for agentic AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanju Goswami", email = "sanju@forwardai.dev" }]
keywords = ["agentic-ai", "llm-evaluation", "ai-red-team", "ai-governance", "owasp-agentic", "attestation", "assurance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

# The reference core is deliberately dependency-light and runs OFFLINE with no API keys.
dependencies = [
  "cryptography>=42",   # Ed25519 signing of the evidence object
]

[project.urls]
Homepage = "https://forwardai.dev/aah/"
Documentation = "https://forwardai.dev/aah/"
Repository = "https://github.com/forwardai-dev/agent-assurance-harness"
Issues = "https://github.com/forwardai-dev/agent-assurance-harness/issues"

[project.optional-dependencies]
# Optional producers/judges — never required for the core gate or offline verify.
llm = ["anthropic>=0.40", "openai>=1.40"]     # real judge/target adapters
stats = ["numpy>=1.26"]                        # richer bootstrap (pure-python fallback ships in core)
adapters = []                                  # promptfoo/garak/inspect wrappers (parse output, no runtime dep)
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
aah = "aah.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aah"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: a few tables/templates intentionally exceed the line limit.
# UP042: `str, Enum` is deliberate for stable JSON round-tripping (kept over StrEnum).
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-property-decorators = true
ignore-private = true
ignore-semiprivate = true
ignore-module = false
fail-under = 80

[tool.bandit]
# B101 assert: used only in tests/invariants, not security controls.
# B105/B311: the fake key in the attack fixture and the seeded RNG for statistical
# bootstrap are intentional and non-security-sensitive; handled inline with justification.
skips = ["B101"]

[tool.coverage.run]
source = ["aah"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]
